services:
  - type: web
    name: aiot-air-quality
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MQTT_BROKER
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC
        value: aqi/node1/readings
      - key: CPCB_CITY
        value: Vadodara
      - key: START_MQTT
        value: "1"
